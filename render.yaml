services:
  - type: web
    name: docai-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0 # Update if you are using a different version
      # Add your backend environment variables here, for example:
      # - key: GEMINI_API_KEY
      #   sync: false
